version: '3.8'

services:
  web:
    build: .
    container_name: meu-secretario-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Passamos as variáveis, mas o valor real vem do arquivo .env
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - BOT_WHATSAPP_URL=${BOT_WHATSAPP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
    networks:
      - app-network
    depends_on:
      # Removemos o postgres daqui, pois ele já está rodando no outro projeto
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs

  # O Redis continua aqui pois é o cache rápido exclusivo desse sistema
  redis:
    image: redis:7-alpine
    container_name: meu-secretario-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge