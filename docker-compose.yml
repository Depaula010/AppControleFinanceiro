version: '3.8'

services:
  # ============================================
  # NGINX REVERSE PROXY
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: meu-secretario-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - rede-global

  # ============================================
  # BACKEND PYTHON/FLASK
  # ============================================
  web:
    build: .
    container_name: meu-secretario-api
    restart: unless-stopped
    networks:
      - rede-global
    environment:
      - TZ=America/Sao_Paulo
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_SIGNATURE_KEY=${WEBHOOK_SIGNATURE_KEY}
      - BOT_WHATSAPP_URL=${BOT_WHATSAPP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OPENROUTE_API_KEY=${OPENROUTE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    # --- CONFIGURAÇÃO DOS CRON JOBS AQUI ---
    labels:
      ofelia.enabled: "true"
      
      # 1. Resumo Matinal (Roda toda hora, o script verifica se deve enviar)
      ofelia.job-exec.resumo-matinal.schedule: "@hourly"
      ofelia.job-exec.resumo-matinal.command: "python /app/app/jobs/daily_briefing.py"
      
      # 2. Relatório Mensal - Mês Anterior (Dia 1 às 08:00)
      # Usa curl interno para disparar o endpoint localmente
      ofelia.job-exec.relatorio-mes-anterior.schedule: "0 8 1 * *"
      ofelia.job-exec.relatorio-mes-anterior.command: "curl -X POST http://localhost:5000/admin/trigger-monthly-reports-inicio -H 'x-api-key: ${API_SECRET_KEY}'"
      
      # 3. Relatório Mensal - Mês Corrente (Último dia do mês)
      # Roda diariamente às 23:00, o backend valida se é o último dia do mês
      ofelia.job-exec.relatorio-mes-corrente.schedule: "0 23 * * *"
      ofelia.job-exec.relatorio-mes-corrente.command: "curl -X POST http://localhost:5000/admin/trigger-monthly-reports-fim -H 'x-api-key: ${API_SECRET_KEY}'"

      # 4. Check-in Noturno (Roda a cada hora entre 18h-23h, o script verifica configuração do usuário)
      ofelia.job-exec.checkin-noturno.schedule: "0 18,19,20,21,22,23 * * *"
      ofelia.job-exec.checkin-noturno.command: "sh -c 'echo \"[OFELIA] Starting checkin-noturno at $(date +\"%Y-%m-%d %H:%M:%S\")\" && python /app/app/jobs/nightly_checkin.py'"

      # 5. Alertas de Tarefas do Google Calendar (Roda a cada minuto)
      ofelia.job-exec.alertas-tarefas.schedule: "@every 1m"
      ofelia.job-exec.alertas-tarefas.command: "python /app/app/jobs/task_alerts.py"

      # 6. Processador de Faturas (Roda diariamente às 02:00 AM)
      ofelia.job-exec.processador-faturas.schedule: "0 2 * * *"
      ofelia.job-exec.processador-faturas.command: "python /app/app/jobs/invoice_processor.py"

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: meu-secretario-redis
    restart: unless-stopped
    networks:
      - rede-global
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ============================================
  # NOVO: AGENDADOR DE TAREFAS (CRON)
  # ============================================
  cron-scheduler:
    image: mcuadros/ofelia:latest
    container_name: meu-secretario-cron
    restart: unless-stopped
    depends_on:
      - web
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rede-global

volumes:
  redis-data:

networks:
  rede-global:
    external: true