version: '3.8'

services:
  # ============================================
  # NGINX REVERSE PROXY (Camada de Proteção)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: meu-secretario-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (redirecionado para HTTPS)
      - "443:443"    # HTTPS (SSL/TLS habilitado)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Certificados SSL
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - rede-global

  # ============================================
  # BACKEND PYTHON/FLASK (Protegido pelo Nginx)
  # ============================================
  web:
    build: .
    container_name: meu-secretario-api
    restart: unless-stopped
    networks:
      - rede-global
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - BOT_WHATSAPP_URL=${BOT_WHATSAPP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs

  # ============================================
  # REDIS (Cache e Sessões)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: meu-secretario-redis
    restart: unless-stopped
    networks:
      - rede-global
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:

networks:
  rede-global:
    external: true