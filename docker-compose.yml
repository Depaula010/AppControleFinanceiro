version: '3.8'

services:
  # ============================================
  # NGINX REVERSE PROXY
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: meu-secretario-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - rede-global

  # ============================================
  # BACKEND PYTHON/FLASK
  # ============================================
  web:
    build: .
    container_name: meu-secretario-api
    restart: unless-stopped
    networks:
      - rede-global
    environment:
      - TZ=America/Sao_Paulo
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - BOT_WHATSAPP_URL=${BOT_WHATSAPP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - DATABASE_URL=${secrets.DATABASE_URL}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    # --- CONFIGURAÇÃO DOS CRON JOBS AQUI ---
    labels:
      ofelia.enabled: "true"
      
      # 1. Resumo Matinal (Roda toda hora, o script verifica se deve enviar)
      ofelia.job-exec.resumo-matinal.schedule: "@hourly"
      ofelia.job-exec.resumo-matinal.command: "python /app/processar_resumo_matinal.py"
      
      # 2. Relatório Mensal - Início do Mês (Dia 1 às 08:00)
      # Usa curl interno para disparar o endpoint localmente
      ofelia.job-exec.relatorio-inicio.schedule: "0 8 1 * *"
      ofelia.job-exec.relatorio-inicio.command: "curl -X POST http://localhost:5000/admin/trigger-monthly-reports-inicio -H 'x-api-key: ${API_SECRET_KEY}'"
      
      # 3. Relatório Mensal - Fim do Mês (Último dia do mês é complexo no cron, usamos dia 28 como segurança ou script específico)
      # Sugestão: Rodar dia 28, 29, 30, 31 e o script Python validar se é o último dia.
      # Abaixo configurado para todo dia às 23:00, o backend deve validar se é fim de mês.
      ofelia.job-exec.relatorio-fim.schedule: "0 23 * * *"
      ofelia.job-exec.relatorio-fim.command: "curl -X POST http://localhost:5000/admin/trigger-monthly-reports-fim -H 'x-api-key: ${API_SECRET_KEY}'"

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: meu-secretario-redis
    restart: unless-stopped
    networks:
      - rede-global
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ============================================
  # NOVO: AGENDADOR DE TAREFAS (CRON)
  # ============================================
  cron-scheduler:
    image: mcuadros/ofelia:latest
    container_name: meu-secretario-cron
    restart: unless-stopped
    depends_on:
      - web
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rede-global

volumes:
  redis-data:

networks:
  rede-global:
    external: true