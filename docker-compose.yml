version: '3.8'

# Virada para o backend .NET 10 (dotnet/). O serviço `web` mantém container_name, porta 8000 e a rede `rede-global`
# porque o nginx (nginx/nginx.conf: meu-secretario-api:8000) e o bot dependem desses nomes.
# Os jobs (antes Ofelia + python /app/app/jobs/*.py) agora rodam dentro do próprio processo (Quartz, JOBS_ENABLED=true).
# Rollback: `git checkout flask-final` e novo deploy (o compose do Flask volta, com Ofelia).

services:
  # ============================================
  # NGINX REVERSE PROXY
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: meu-secretario-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - rede-global

  # ============================================
  # BACKEND .NET 10 (ASP.NET Core + Quartz)
  # ============================================
  web:
    build: ./dotnet
    container_name: meu-secretario-api
    restart: unless-stopped
    networks:
      - rede-global
    environment:
      - TZ=America/Sao_Paulo
      - ASPNETCORE_URLS=http://+:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_SIGNATURE_KEY=${WEBHOOK_SIGNATURE_KEY}
      - BOT_WHATSAPP_URL=${BOT_WHATSAPP_URL}
      - BOT_SESSION_NAME=${BOT_SESSION_NAME:-sessao-principal}
      - BOT_SESSION_ID=${BOT_SESSION_ID}
      - BOT_API_KEY=${BOT_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OPENROUTE_API_KEY=${OPENROUTE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      # Jobs agendados dentro do processo (resumo matinal, check-in, alertas, faturas, relatórios, motor).
      - JOBS_ENABLED=true
      # Logs só no console (docker logs): o diretório do usuário `app` na imagem não é o bind mount do host.
      - LOG_TO_FILE=false
    depends_on:
      redis:
        condition: service_started

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: meu-secretario-redis
    restart: unless-stopped
    networks:
      - rede-global
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:

networks:
  rede-global:
    external: true
