name: Deploy to Contabo

on:
  push:
    branches:
      - main
      - master
    # Mudanças só de documentação não derrubam nem recriam os containers.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "dotnet/specs/**"
      - ".claude/**"
      - "postman/**"
  workflow_dispatch:  # Permite trigger manual

env:
  DEPLOY_PATH: /opt/meu-secretario
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Um deploy por vez: dois merges seguidos entram em fila (sem cancelar o que já está rodando).
concurrency:
  group: deploy-contabo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_KEY }}

      - name: 📝 Add Contabo to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.CONTABO_HOST }} >> ~/.ssh/known_hosts

      - name: 🧪 Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }} "echo '✅ SSH connection successful'"

      - name: 🚀 Deploy to Contabo
        env:
          HOST: ${{ secrets.CONTABO_HOST }}
          USER: ${{ secrets.CONTABO_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          WEBHOOK_SIGNATURE_KEY: ${{ secrets.WEBHOOK_SIGNATURE_KEY }}
          BOT_WHATSAPP_URL: ${{ secrets.BOT_WHATSAPP_URL }}
          BOT_SESSION_NAME: ${{ secrets.BOT_SESSION_NAME }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          OPS_ALERT_WHATSAPP: ${{ secrets.OPS_ALERT_WHATSAPP }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          OPENROUTE_API_KEY: ${{ secrets.OPENROUTE_API_KEY }}
          COACH_AGENDA_API_KEY: ${{ secrets.COACH_AGENDA_API_KEY }}
          COACH_AGENDA_USER_ID: ${{ secrets.COACH_AGENDA_USER_ID }}
        run: |
          ssh $USER@$HOST bash << 'ENDSSH'
            set -e  # Exit on error
            
            echo "📂 Navigating to project directory..."
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main  # ou origin/master
            
            echo "📝 Updating .env file..."
            cat > .env << 'ENVEOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=redis://redis:6379
          API_SECRET_KEY=${{ secrets.API_SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          WEBHOOK_SIGNATURE_KEY=${{ secrets.WEBHOOK_SIGNATURE_KEY }}
          BOT_WHATSAPP_URL=${{ secrets.BOT_WHATSAPP_URL }}
          BOT_SESSION_NAME=${{ secrets.BOT_SESSION_NAME }}
          BOT_API_KEY=${{ secrets.BOT_API_KEY }}
          OPS_ALERT_WHATSAPP=${{ secrets.OPS_ALERT_WHATSAPP }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          OPENROUTE_API_KEY=${{ secrets.OPENROUTE_API_KEY }}
          COACH_AGENDA_API_KEY=${{ secrets.COACH_AGENDA_API_KEY }}
          COACH_AGENDA_USER_ID=${{ secrets.COACH_AGENDA_USER_ID }}
          ENVEOF
            
            # Servidor compartilhado (docs/SERVIDOR_CONTABO.md): só mexe neste projeto (compose project = esta pasta), nunca em
            # `docker system prune` nem em containers de outro projeto.
            echo "📸 Anotando as imagens atuais deste projeto (para remover só as antigas no fim)..."
            OLD_IMAGES=$(docker compose images -q 2>/dev/null | sort -u | xargs echo || true)

            # Build ANTES de qualquer down: os containers atuais continuam atendendo durante o build (~3 min). Se o build
            # falhar, o `set -e` para aqui e a versão em produção segue no ar.
            echo "🏗️ Building new images (os containers atuais continuam no ar)..."
            docker compose build --no-cache
            
            echo "🗄️ Subindo Redis e aplicando migrations do .NET (aditivas, idempotentes)..."
            docker compose up -d redis
            sleep 3
            docker compose run --rm -T --no-deps web --migrate < /dev/null

            echo "🧹 Limpando chaves do Redis específicas do Flask (dedupe invoice_*/calendar_* é mantido)..."
            docker compose exec -T redis sh -c 'for p in "pending_*" "nightly_checkin*" "security:*" "gemini_cache:*"; do redis-cli --scan --pattern "$p" | xargs -r redis-cli del > /dev/null; done' < /dev/null

            echo "🚀 Recriando só o que mudou (queda de segundos, não de minutos)..."
            docker compose up -d --remove-orphans
            
            echo "⏳ Waiting for containers to be healthy..."
            sleep 20
            
            echo "📊 Container status:"
            docker compose ps
            
            echo "📋 Recent logs:"
            docker compose logs --tail=30 web

            # Só depois de subir: remove as imagens ANTIGAS deste projeto. `docker image rm` sem -f nunca apaga imagem em uso
            # (inclusive por outro projeto), então o que ainda é usado fica. E, por label, as soltas deste projeto.
            echo "🗑️ Removendo imagens antigas deste projeto (sem prune global)..."
            for img in $OLD_IMAGES; do docker image rm "$img" > /dev/null 2>&1 || true; done
            docker image prune -f --filter "label=app=meu-secretario" > /dev/null || true

            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: 🔍 Health Check
        run: |
          echo "⏳ Aguardando 30 segundos para containers iniciarem..."
          sleep 30

          echo "🔍 Testando conexão com o backend via SSH (127.0.0.1:8080, atrás do nginx nativo da VPS)..."
          response=$(ssh -o StrictHostKeyChecking=no ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/" || echo "0")

          echo "📡 HTTP Status Code: $response"

          if [ "$response" -eq 200 ]; then
            echo "✅ Health check passed! meu-secretario-nginx respondendo em 127.0.0.1:8080."
          else
            echo "❌ Health check failed! HTTP status: $response"
            echo "🔍 Verificando logs do Nginx..."
            ssh -o StrictHostKeyChecking=no ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }} "docker logs --tail=20 meu-secretario-nginx"
            exit 1
          fi

      - name: 🎉 Deployment Success Notification
        if: success()
        run: |
          echo "=================================================="
          echo "✅ Deployment successful!"
          echo "🌐 Application URL: http://${{ secrets.CONTABO_HOST }}"
          echo "🔒 Admin Panel: http://${{ secrets.CONTABO_HOST }}/admin/"
          echo "📊 Check logs: docker compose logs -f web"
          echo "🔐 Nginx logs: docker compose logs -f nginx"
          echo "=================================================="

      - name: ❌ Deployment Failed Notification
        if: failure()
        run: |
          echo "=================================================="
          echo "❌ Deployment failed!"
          echo "🔍 Check the logs above for details"
          echo "💡 SSH to server: ssh ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}"
          echo "📋 View logs: docker compose logs web"
          echo "=================================================="