name: CI .NET

on:
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, master]
    paths:
      - "dotnet/**"
      - ".github/workflows/ci.yml"

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        run: dotnet restore MeuSecretario.slnx

      - name: Build (warnings como erro)
        run: dotnet build MeuSecretario.slnx --no-restore -c Release

      - name: Testes com cobertura
        run: >
          dotnet test MeuSecretario.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./TestResults
          --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: dotnet/TestResults/
          if-no-files-found: ignore

  docker-build:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (sem push)
        run: docker build -t meu-secretario-api:ci ./dotnet
