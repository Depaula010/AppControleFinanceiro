        return 404;
    }

    # ==============================================
    # ENDPOINTS DA APLICAÇÃO (HTTPS)
    # ==============================================

    # Endpoint principal (/)
    location / {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
