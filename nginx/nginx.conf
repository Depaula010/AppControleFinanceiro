# Nginx Configuration - Reverse Proxy + Security
# Meu Secretário API - Proteção contra Bots e Scanners

events {
    worker_connections 1024;
}

http {
    # Limite de taxa de requisições (rate limiting)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=50r/s;

    # Limite de conexões simultâneas
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream - Backend Python (Flask/Gunicorn)
    upstream backend {
        server meu-secretario-api:8000;
    }

    # Bloquear User-Agents de bots conhecidos
    map $http_user_agent $bad_bot {
        default 0;
        ~*sqlmap 1;
        ~*nikto 1;
        ~*nmap 1;
        ~*masscan 1;
        ~*acunetix 1;
        ~*nessus 1;
        ~*openvas 1;
        ~*metasploit 1;
        ~*havij 1;
        ~*zgrab 1;
        ~*dirbuster 1;
        ~*gobuster 1;
        ~*wpscan 1;
        ~*python-requests/2.6 1;  # Scanner comum
    }

    # Servidor HTTP (porta 80)
    server {
    listen 80;
    server_name _;  # Aceita qualquer domínio (ou coloque seu domínio)

    # Tamanho máximo do body (evita upload de arquivos grandes maliciosos)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Limite de conexões simultâneas por IP
    limit_conn conn_limit 10;

    # Logs personalizados
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # ==============================================
    # BLOQUEIOS DE SEGURANÇA
    # ==============================================

    # Bloquear bots conhecidos
    if ($bad_bot) {
        return 403;
    }

    # Bloquear requisições sem User-Agent
    if ($http_user_agent = "") {
        return 403;
    }

    # Bloquear métodos HTTP inválidos
    if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH)$ ) {
        return 405;
    }

    # Bloquear URLs suspeitas (scanners)
    location ~ /(\.env|\.git|\.svn|\.htaccess|\.htpasswd|wp-admin|wp-login|phpMyAdmin|phpmyadmin|adminer|backup|\.sql|\.bak|\.old|config\.php|shell\.php) {
        return 404;
    }

    # Bloquear tentativas de path traversal
    location ~ \.\. {
        return 404;
    }

    # Bloquear scripts suspeitos
    location ~ \.(asp|aspx|jsp|cgi|pl)$ {
        return 404;
    }

    # ==============================================
    # ENDPOINTS DA APLICAÇÃO
    # ==============================================

    # Endpoint principal (/)
    location / {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts do proxy
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Endpoints de API (/api/*)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Webhooks (/webhook-*)
    location /webhook- {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhooks podem demorar mais
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Endpoints administrativos (/admin/*)
    location /admin/ {
        limit_req zone=admin_limit burst=5 nodelay;

        # Autenticação via x-api-key (header obrigatório)
        # Whitelist de IP removida para facilitar desenvolvimento
        # Segurança mantida: HTTPS + API Key + Rate Limiting + Auto-block

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (para monitoramento)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Bloquear tudo que não foi explicitamente permitido
    location ~ ^/(nice%20ports|devicedesc\.xml|CFIDE|dana-|geoserver|fog/) {
        return 404;
    }
}

# ==============================================
# CONFIGURAÇÃO HTTPS (SSL/TLS)
# ==============================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;  # Aceita qualquer domínio/IP

    # Certificados SSL (auto-assinado para uso com IP)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Configurações SSL modernas (A+ no SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling (desabilitado para certificado auto-assinado)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Headers de Segurança HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP (Content Security Policy)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Tamanho máximo do body
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Limite de conexões simultâneas por IP
    limit_conn conn_limit 10;

    # Logs personalizados
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # ==============================================
