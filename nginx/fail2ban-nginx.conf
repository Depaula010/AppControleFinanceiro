# ============================================
# CONFIGURAÇÃO FAIL2BAN PARA MEU SECRETÁRIO
# ============================================
#
# Este arquivo contém as configurações do Fail2Ban para proteger a aplicação.
# Fail2Ban monitora logs e bane automaticamente IPs com comportamento suspeito.
#
# INSTALAÇÃO:
# -----------
# 1. Instalar Fail2Ban no servidor:
#    sudo apt-get update
#    sudo apt-get install fail2ban -y
#
# 2. Copiar este arquivo para:
#    sudo mkdir -p /etc/fail2ban/filter.d
#    sudo cp nginx/fail2ban-nginx.conf /etc/fail2ban/jail.d/meu-secretario.conf
#
# 3. Reiniciar Fail2Ban:
#    sudo systemctl restart fail2ban
#
# 4. Verificar status:
#    sudo fail2ban-client status
#    sudo fail2ban-client status meu-secretario-auth
#    sudo fail2ban-client status meu-secretario-limit
#
# COMANDOS ÚTEIS:
# ---------------
# Ver IPs banidos:
#   sudo fail2ban-client status meu-secretario-auth
#
# Desbanir IP:
#   sudo fail2ban-client set meu-secretario-auth unbanip 1.2.3.4
#
# Ver log do Fail2Ban:
#   sudo tail -f /var/log/fail2ban.log

# ============================================
# JAIL 1: Proteção contra Autenticação
# ============================================
# Bane IPs que tentam acessar endpoints protegidos repetidamente
[meu-secretario-auth]
enabled  = true
port     = 80,443
protocol = tcp
filter   = meu-secretario-auth
logpath  = /opt/meu-secretario/nginx/logs/access.log
maxretry = 5          # Banir após 5 tentativas
findtime = 600        # Janela de 10 minutos
bantime  = 3600       # Banir por 1 hora
action   = iptables-multiport[name=meu-secretario-auth, port="80,443", protocol=tcp]

# ============================================
# JAIL 2: Proteção contra Rate Limiting
# ============================================
# Bane IPs que excedem rate limits do Nginx
[meu-secretario-limit]
enabled  = true
port     = 80,443
protocol = tcp
filter   = meu-secretario-limit
logpath  = /opt/meu-secretario/nginx/logs/error.log
maxretry = 10         # Banir após 10 rate limits
findtime = 300        # Janela de 5 minutos
bantime  = 1800       # Banir por 30 minutos
action   = iptables-multiport[name=meu-secretario-limit, port="80,443", protocol=tcp]

# ============================================
# JAIL 3: Proteção contra Bots/Scanners
# ============================================
# Bane IPs que tentam acessar URLs suspeitas
[meu-secretario-bots]
enabled  = true
port     = 80,443
protocol = tcp
filter   = meu-secretario-bots
logpath  = /opt/meu-secretario/nginx/logs/access.log
maxretry = 3          # Banir após 3 tentativas
findtime = 300        # Janela de 5 minutos
bantime  = 7200       # Banir por 2 horas
action   = iptables-multiport[name=meu-secretario-bots, port="80,443", protocol=tcp]
