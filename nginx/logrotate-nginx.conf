# Configuração de Log Rotation para Nginx
# Este arquivo deve ser copiado para: /etc/logrotate.d/nginx-meu-secretario
#
# Para instalar no servidor:
# sudo cp nginx/logrotate-nginx.conf /etc/logrotate.d/nginx-meu-secretario
# sudo chmod 644 /etc/logrotate.d/nginx-meu-secretario
#
# Testar configuração:
# sudo logrotate -d /etc/logrotate.d/nginx-meu-secretario
#
# Forçar rotação manual (teste):
# sudo logrotate -f /etc/logrotate.d/nginx-meu-secretario

/opt/meu-secretario/nginx/logs/*.log {
    # Frequência de rotação
    daily                    # Rotaciona diariamente

    # Quantos arquivos antigos manter
    rotate 14                # Mantém últimos 14 dias

    # Ações após rotação
    compress                 # Compacta logs antigos (gzip)
    delaycompress            # Não compacta o log mais recente (para análise rápida)
    notifempty               # Não rotaciona se log estiver vazio
    missingok                # Não gera erro se log não existir

    # Criar novo arquivo de log
    create 0640 root root    # Cria novo log com permissões corretas

    # Permissões de acesso
    su root root             # Executa como root

    # Recarregar Nginx após rotação (envia sinal USR1)
    sharedscripts            # Executa script apenas uma vez (não por arquivo)
    postrotate
        # Envia sinal para Nginx reabrir arquivos de log
        docker exec meu-secretario-nginx nginx -s reopen > /dev/null 2>&1 || true
    endscript
}
