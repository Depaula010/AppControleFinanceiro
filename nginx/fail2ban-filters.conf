# ============================================
# FILTROS FAIL2BAN PARA MEU SECRETÁRIO
# ============================================
#
# Este arquivo contém os filtros (regex) usados pelo Fail2Ban.
#
# INSTALAÇÃO:
# -----------
# Copiar cada seção abaixo para arquivos separados em /etc/fail2ban/filter.d/
#
# sudo cp conteudo-abaixo /etc/fail2ban/filter.d/meu-secretario-auth.conf
# sudo cp conteudo-abaixo /etc/fail2ban/filter.d/meu-secretario-limit.conf
# sudo cp conteudo-abaixo /etc/fail2ban/filter.d/meu-secretario-bots.conf

# ============================================
# ARQUIVO: /etc/fail2ban/filter.d/meu-secretario-auth.conf
# ============================================
[Definition]

# Detectar tentativas de acesso a /admin bloqueadas (403)
failregex = ^<HOST> .* "(GET|POST|HEAD) /admin/.* HTTP/.*" 403 .*$

# Detectar múltiplas requisições bloqueadas por autenticação
            ^<HOST> .* "(GET|POST) .* HTTP/.*" 401 .*$

# Ignorar IPs whitelisted (substitua pelo seu IP)
ignoreregex = ^212\.47\.65\.37 .*

# ============================================
# ARQUIVO: /etc/fail2ban/filter.d/meu-secretario-limit.conf
# ============================================
[Definition]

# Detectar rate limiting do Nginx
failregex = limiting requests, excess: .* by zone ".*", client: <HOST>,

# Detectar conexões simultâneas excedidas
            limiting connections by zone ".*", client: <HOST>

ignoreregex =

# ============================================
# ARQUIVO: /etc/fail2ban/filter.d/meu-secretario-bots.conf
# ============================================
[Definition]

# Detectar tentativas de acesso a URLs suspeitas (404/403)
failregex = ^<HOST> .* "(GET|POST) /(\.env|\.git|wp-admin|phpMyAdmin|shell\.php|config\.php|\.sql|\.bak|devicedesc\.xml|CFIDE|dana-).* HTTP/.*" (404|403) .*$

# Detectar bots conhecidos bloqueados (403)
            ^<HOST> .* ".*(sqlmap|nikto|nmap|masscan|acunetix|metasploit|dirbuster).*" 403 .*$

# Detectar requisições sem User-Agent (403)
            ^<HOST> .* "-" 403 .*$

ignoreregex =

# ============================================
# INSTRUÇÕES DE INSTALAÇÃO COMPLETA
# ============================================
#
# 1. Criar arquivo de jail:
#    sudo nano /etc/fail2ban/jail.d/meu-secretario.conf
#    (copiar conteúdo de fail2ban-nginx.conf)
#
# 2. Criar filtro de autenticação:
#    sudo nano /etc/fail2ban/filter.d/meu-secretario-auth.conf
#    (copiar seção [Definition] do meu-secretario-auth acima)
#
# 3. Criar filtro de rate limit:
#    sudo nano /etc/fail2ban/filter.d/meu-secretario-limit.conf
#    (copiar seção [Definition] do meu-secretario-limit acima)
#
# 4. Criar filtro de bots:
#    sudo nano /etc/fail2ban/filter.d/meu-secretario-bots.conf
#    (copiar seção [Definition] do meu-secretario-bots acima)
#
# 5. Testar filtros:
#    sudo fail2ban-regex /opt/meu-secretario/nginx/logs/access.log /etc/fail2ban/filter.d/meu-secretario-auth.conf
#    sudo fail2ban-regex /opt/meu-secretario/nginx/logs/error.log /etc/fail2ban/filter.d/meu-secretario-limit.conf
#    sudo fail2ban-regex /opt/meu-secretario/nginx/logs/access.log /etc/fail2ban/filter.d/meu-secretario-bots.conf
#
# 6. Reiniciar Fail2Ban:
#    sudo systemctl restart fail2ban
#    sudo systemctl status fail2ban
#
# 7. Verificar jails ativos:
#    sudo fail2ban-client status
#
# 8. Ver IPs banidos:
#    sudo fail2ban-client status meu-secretario-auth
#    sudo fail2ban-client status meu-secretario-limit
#    sudo fail2ban-client status meu-secretario-bots
